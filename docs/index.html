<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bülten Paneli · İnovakademi</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar no-print">
  <div class="brand">
    <strong>İnovakademi</strong>
    <span>Haftalık Dış Ticaret Bülteni · Panel</span>
  </div>
  <div class="actions">
    <label class="sr" for="archive">Arşiv</label>
    <select id="archive" title="Arşivden bülten seç"></select>
    <button id="copyAll" class="primary">Tümünü kopyala</button>
    <button id="print">Yazdır / PDF</button>
    <a id="rerun" class="btn" target="_blank" rel="noopener">Yeniden oluştur ↗</a>
    <button id="reset" class="ghost" title="Bu bülten için yaptığınız düzenlemeleri silip orijinale döner">Düzenlemeleri sıfırla</button>
  </div>
</header>

<main id="app">
  <p class="muted">Yükleniyor…</p>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
