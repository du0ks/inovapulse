<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dış Ticaret Bülteni</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="sheet.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span>Dış Ticaret Bülteni</span>
    </div>
    <label class="issue">
      <span class="sr">Bülten tarihi</span>
      <select id="archive"></select>
    </label>
    <div class="bar-actions">
      <button id="copyAll" class="btn primary" type="button"></button>
      <button id="print" class="btn icon-only-sm" type="button" title="Bülteni Canva düzeninde PDF olarak indir"></button>
      <div class="menu">
        <button id="menuBtn" class="btn ghost square" type="button" aria-haspopup="true" aria-expanded="false" title="Diğer işlemler"></button>
        <div id="menu" class="menu-pop" role="menu" hidden>
          <button type="button" role="menuitem" data-act="help">Nasıl kullanılır?</button>
          <button type="button" role="menuitem" data-act="rerun">Taslağı yeniden oluştur</button>
          <button type="button" role="menuitem" data-act="reset" class="danger">Değişikliklerimi geri al</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="app" class="page">
  <p class="loading">Yükleniyor…</p>
</main>

<dialog id="dialog"><div id="dialogBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="preview" hidden><div id="sheet"></div></div>
<script src="app.js"></script>
<script src="sheet.js"></script>
</body>
</html>
